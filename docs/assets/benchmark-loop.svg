<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
<title id="title">Benchmark methodology loop</title><desc id="desc">A five-step evidence loop: record conditions, match the workload, warm up, repeat runs, and report distributions with raw evidence.</desc>
<defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17202a}.num{font-size:18px;font-weight:700;fill:#fff}.title{font-size:16px;font-weight:700}.body{font-size:13px;fill:#53606b}.arrow{stroke:#66727d;stroke-width:2.4;fill:none;marker-end:url(#arrow)}@media (prefers-color-scheme: dark){text{fill:#eef2f5}.body{fill:#b8c4ce}rect[fill="#fafbfc"]{fill:#151a1f}}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#66727d"/></marker></defs>
<rect width="1200" height="250" rx="16" fill="#fafbfc"/>
<g><circle cx="105" cy="92" r="28" fill="#13a9b6"/><text class="num" x="99" y="99">1</text><text class="title" x="60" y="151">Record</text><text class="body" x="44" y="174">machine + versions</text></g>
<g><circle cx="345" cy="92" r="28" fill="#7564c4"/><text class="num" x="339" y="99">2</text><text class="title" x="292" y="151">Match</text><text class="body" x="264" y="174">world + route + settings</text></g>
<g><circle cx="585" cy="92" r="28" fill="#d89b22"/><text class="num" x="579" y="99">3</text><text class="title" x="552" y="151">Warm up</text><text class="body" x="524" y="174">five minutes first</text></g>
<g><circle cx="825" cy="92" r="28" fill="#4f8f68"/><text class="num" x="819" y="99">4</text><text class="title" x="797" y="151">Repeat</text><text class="body" x="760" y="174">same route, ≥5 runs</text></g>
<g><circle cx="1065" cy="92" r="28" fill="#8b98a4"/><text class="num" x="1059" y="99">5</text><text class="title" x="1016" y="151">Report</text><text class="body" x="994" y="174">median + p95/p99</text></g>
<path class="arrow" d="M138 92 H312"/><path class="arrow" d="M378 92 H552"/><path class="arrow" d="M618 92 H792"/><path class="arrow" d="M858 92 H1032"/>
<path class="arrow" d="M1065 46 C980 12 220 12 105 46"/>
<text class="body" x="440" y="222">Keep raw output and test notes beside every aggregate.</text>
</svg>
