<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 20" width="100%" height="20">
  <defs>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="20%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffca28" stop-opacity="1">
        <animate attributeName="stop-color" values="#ffca28;#38ef7d;#00f2fe;#ffca28" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="80%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Horizontal Glow Line -->
  <line x1="10" y1="10" x2="790" y2="10" stroke="url(#dividerGrad)" stroke-width="2" />

  <!-- Center Diamond Indicator -->
  <polygon points="400,4 406,10 400,16 394,10" fill="#00f2fe">
    <animateTransform attributeName="transform" type="rotate" from="0 400 10" to="360 400 10" dur="6s" repeatCount="indefinite"/>
  </polygon>
</svg>
