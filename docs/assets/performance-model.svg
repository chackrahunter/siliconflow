<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Apple-Silicon frame-time model</title><desc id="desc">A four-layer model showing shared memory, rendering, operating-system scheduling, and evidence as connected contributors to frame-time behavior.</desc>
<defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17202a}.title{font-size:18px;font-weight:700}.body{font-size:15px;fill:#53606b}.note{font-size:14px;fill:#53606b}.layer{stroke-width:2}.arrow{stroke:#66727d;stroke-width:2.4;fill:none;marker-end:url(#arrow)}@media (prefers-color-scheme: dark){text{fill:#eef2f5}.body,.note{fill:#b8c4ce}rect[fill="#fafbfc"]{fill:#151a1f}.layer[fill="#eefbfc"]{fill:#123238}.layer[fill="#f2f0ff"]{fill:#282449}.layer[fill="#fff8e8"]{fill:#3b2f15}.layer[fill="#f3f5f7"]{fill:#242b31}}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#66727d"/></marker></defs>
<rect width="1200" height="300" rx="16" fill="#fafbfc"/>
<rect class="layer" x="28" y="52" width="250" height="136" rx="12" fill="#eefbfc" stroke="#13a9b6"/><text class="title" x="52" y="86">Shared memory</text><text class="body" x="52" y="116">JVM heap + native client</text><text class="body" x="52" y="140">GPU resources + compositor</text><text class="body" x="52" y="164">Pressure and swap matter</text>
<rect class="layer" x="322" y="52" width="250" height="136" rx="12" fill="#f2f0ff" stroke="#7564c4"/><text class="title" x="346" y="86">Render path</text><text class="body" x="346" y="116">OpenGL translated to Metal</text><text class="body" x="346" y="140">HiDPI fill and upload cost</text><text class="body" x="346" y="164">World and UI workload</text>
<rect class="layer" x="616" y="52" width="250" height="136" rx="12" fill="#fff8e8" stroke="#d89b22"/><text class="title" x="640" y="86">OS authority</text><text class="body" x="640" y="116">Scheduling and QoS</text><text class="body" x="640" y="140">Power mode and App Nap</text><text class="body" x="640" y="164">macOS remains in charge</text>
<rect class="layer" x="910" y="52" width="262" height="136" rx="12" fill="#f3f5f7" stroke="#8b98a4"/><text class="title" x="934" y="86">Optimization loop</text><text class="body" x="934" y="116">Tune frame-time behavior</text><text class="body" x="934" y="140">Memory and workload signals</text><text class="body" x="934" y="164">Optional test notes</text>
<path class="arrow" d="M278 120 H322"/><path class="arrow" d="M572 120 H616"/><path class="arrow" d="M866 120 H910"/>
<text class="note" x="40" y="238">SiliconFlow can observe selected signals and apply bounded policies; it cannot turn unavailable GPU, VRAM, or core-placement data into measurements.</text>
</svg>
