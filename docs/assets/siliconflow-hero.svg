<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">SiliconFlow — Apple-Silicon performance for Minecraft</title>
<desc id="desc">A dark blue-green hero graphic with a stylized Apple-Silicon chip, flowing frame-time signal, and the words SiliconFlow.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131d"/><stop offset=".55" stop-color="#102d38"/><stop offset="1" stop-color="#282449"/></linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#13b8c5"/><stop offset="1" stop-color="#d89b22"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
  <style>@keyframes heroPulse{0%,100%{opacity:.28;transform:scale(1)}50%{opacity:.58;transform:scale(1.08)}}@keyframes signalFlow{to{stroke-dashoffset:-72}}.pulse{transform-box:fill-box;transform-origin:center;animation:heroPulse 5s ease-in-out infinite}.signal{stroke-dasharray:12 18;animation:signalFlow 7s linear infinite}@media (prefers-reduced-motion:reduce){.pulse,.signal{animation:none}}text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.eyebrow{font-size:17px;letter-spacing:3px;fill:#9be5e9;font-weight:700}.word{font-size:64px;letter-spacing:-2px;fill:#fff;font-weight:800}.sub{font-size:22px;fill:#c4d4dc}.micro{font-size:14px;fill:#8ea5b2;letter-spacing:1px}.pin{fill:#9be5e9}</style>
</defs>
<rect width="1200" height="360" rx="24" fill="url(#bg)"/>
<circle class="pulse" cx="1010" cy="90" r="180" fill="#13b8c5" opacity=".28" filter="url(#blur)"/><circle class="pulse" cx="850" cy="320" r="180" fill="#7564c4" opacity=".22" filter="url(#blur)" style="animation-delay:-2.5s"/>
<path class="signal" d="M0 278 C110 252 155 302 252 274 S390 239 482 268 S624 300 716 247 S832 193 934 224 S1080 270 1200 212" fill="none" stroke="url(#glow)" stroke-width="3" opacity=".75"/>
<g transform="translate(802 70)"><rect x="0" y="0" width="220" height="220" rx="42" fill="#0a1924" stroke="#5ed7d9" stroke-width="2"/><rect x="30" y="30" width="160" height="160" rx="25" fill="#123238" stroke="#13b8c5" stroke-width="2"/><path d="M78 72h64v28h-28v48H86v-48H58V72h20zm-20 96h84v14H58z" fill="#dffbfc" opacity=".95"/><g class="pin"><path d="M-14 48h14v10h-14zm0 35h14v10h-14zm0 35h14v10h-14zm234-70h14v10h-14zm0 35h14v10h-14zm0 35h14v10h-14zM48-14h10V0H48zm35 0h10V0H83zm35 0h10V0h-10zM48 220h10v14H48zm35 0h10v14H83zm35 0h10v14h-10z"/></g></g>
<text x="72" y="104" class="eyebrow">M-CHIP / CLIENT-SIDE / FABRIC</text><text x="70" y="178" class="word">SiliconFlow</text><text x="74" y="218" class="sub">Performance, tuned for unified memory.</text><text x="74" y="252" class="micro">MINECRAFT 1.21.4  ·  BETA  ·  macOS / APPLE SILICON</text>
</svg>
