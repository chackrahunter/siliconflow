<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">SiliconFlow architecture</title><desc id="desc">Minecraft client workload signals flow into SiliconFlow optimization policies. Optional developer diagnostics inspect those decisions, while performance controls flow back to the client.</desc>
<defs><style>@keyframes architectureFlow{to{stroke-dashoffset:-54}}.flow{stroke-dasharray:10 17;animation:architectureFlow 5s linear infinite}.flow.secondary{animation-delay:-2.2s}@media (prefers-reduced-motion:reduce){.flow{animation:none}}text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17202a}.small{font-size:15px;fill:#53606b}.label{font-size:17px;font-weight:700}.box{fill:#fff;stroke:#b8c4ce;stroke-width:2}.accent{fill:#eefbfc;stroke:#13b8c5;stroke-width:2}.control{fill:#fff8e8;stroke:#d89b22;stroke-width:2}.out{fill:#f2f0ff;stroke:#7564c4;stroke-width:2}.arrow{stroke:#66727d;stroke-width:2.5;fill:none;marker-end:url(#arrow)}@media (prefers-color-scheme: dark){text{fill:#eef2f5}.small{fill:#b8c4ce}.box{fill:#1d2329;stroke:#66727d}.accent{fill:#123238}.control{fill:#3b2f15}.out{fill:#282449}rect[fill="#fafbfc"]{fill:#151a1f}}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#66727d"/></marker></defs>
<rect width="1200" height="330" rx="16" fill="#fafbfc"/>
<rect class="box" x="28" y="78" width="200" height="174" rx="12"/><text class="label" x="52" y="112">Minecraft client</text><text class="small" x="52" y="145">frame intervals</text><text class="small" x="52" y="170">GC / memory probes</text><text class="small" x="52" y="195">runtime + mod state</text><text class="small" x="52" y="220">render context</text>
<rect class="accent" x="290" y="52" width="250" height="226" rx="12"/><text class="label" x="316" y="90">SiliconFlow core</text><text class="small" x="316" y="125">sample &amp; classify</text><text class="small" x="316" y="150">detect spikes</text><text class="small" x="316" y="175">apply active profile</text><text class="small" x="316" y="200">check integrations</text><text class="small" x="316" y="236">best-effort, bounded</text>
<rect class="out" x="604" y="78" width="230" height="174" rx="12"/><text class="label" x="630" y="112">Optional diagnostics</text><text class="small" x="630" y="145">F8 overlay</text><text class="small" x="630" y="170">development context</text><text class="small" x="630" y="195">optional recorder</text><text class="small" x="630" y="220">troubleshooting only</text>
<rect class="control" x="898" y="78" width="274" height="174" rx="12"/><text class="label" x="924" y="112">Optional controls</text><text class="small" x="924" y="145">soft visual reductions</text><text class="small" x="924" y="170">thread / QoS requests</text><text class="small" x="924" y="195">compatibility gates</text><text class="small" x="924" y="220">user-owned settings</text>
<path class="arrow flow" d="M228 165 H290"/><path class="arrow flow" d="M540 145 H604"/><path class="arrow flow secondary" d="M540 210 C680 300 825 300 898 210"/><text class="small" x="556" y="317">policy decisions return to the client; macOS remains the scheduler</text>
</svg>
