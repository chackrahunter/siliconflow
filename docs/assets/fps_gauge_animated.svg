<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <!-- Gauge 1 Gradient: Amber -> Green -> Cyan -->
    <linearGradient id="fpsGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffca28" />
      <stop offset="50%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Gauge 2 Gradient: Amber -> Cyan -->
    <linearGradient id="ftGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffca28" />
      <stop offset="60%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Gauge 3 Gradient: Neon Green -->
    <linearGradient id="lockGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <filter id="dialGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="796" height="196" rx="14" fill="#080e14" stroke="#00e5ff" stroke-width="1.5" />

  <!-- Top Title & Badge -->
  <text x="24" y="28" fill="#8b949e" font-family="monospace" font-size="11" font-weight="bold">SILICONFLOW REAL-TIME TELEMETRIC DIALS</text>
  <rect x="670" y="14" width="115" height="20" rx="10" fill="#003b46" stroke="#00f2fe" stroke-width="1">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="727" y="28" fill="#00f2fe" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">LIVE ENGINE</text>

  <!-- ========================================== -->
  <!-- GAUGE 1: FPS COUNTER (541.0 FPS)           -->
  <!-- ========================================== -->
  <g transform="translate(140, 115)">
    <!-- Base Background Track (240 deg arc) -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="#15222e" stroke-width="9" 
            stroke-dasharray="230 345.5" stroke-linecap="round" transform="rotate(150)" />
    
    <!-- Glowing Animated Active Arc -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="url(#fpsGrad)" stroke-width="9" 
            stroke-dasharray="230 345.5" stroke-dashoffset="60" stroke-linecap="round" 
            transform="rotate(150)" filter="url(#dialGlow)">
      <animate attributeName="stroke-dashoffset" values="75;50;65;45;60" dur="3.5s" repeatCount="indefinite" />
    </circle>
    
    <text x="0" y="-2" fill="#ffffff" font-family="monospace" font-size="24" font-weight="bold" text-anchor="middle">541.0</text>
    <text x="0" y="16" fill="#38ef7d" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">FPS [STABLE]</text>
    <text x="0" y="32" fill="#8b949e" font-family="monospace" font-size="9" text-anchor="middle">PEAK: 1,108 FPS</text>
  </g>

  <!-- ========================================== -->
  <!-- GAUGE 2: FRAMETIME DIAL (1.8 ms)           -->
  <!-- ========================================== -->
  <g transform="translate(400, 115)">
    <!-- Base Background Track (240 deg arc) -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="#15222e" stroke-width="9" 
            stroke-dasharray="230 345.5" stroke-linecap="round" transform="rotate(150)" />
    
    <!-- Glowing Animated Active Arc (Starts perfectly from base!) -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="url(#ftGrad)" stroke-width="9" 
            stroke-dasharray="230 345.5" stroke-dashoffset="160" stroke-linecap="round" 
            transform="rotate(150)" filter="url(#dialGlow)">
      <animate attributeName="stroke-dashoffset" values="170;150;165;145;160" dur="2.8s" repeatCount="indefinite" />
    </circle>
    
    <text x="0" y="-2" fill="#ffca28" font-family="monospace" font-size="24" font-weight="bold" text-anchor="middle">1.8 ms</text>
    <text x="0" y="16" fill="#00f2fe" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">FRAMETIME (EMA)</text>
    <text x="0" y="32" fill="#8b949e" font-family="monospace" font-size="9" text-anchor="middle">MIN: 1.1 / MAX: 6.8</text>
  </g>

  <!-- ========================================== -->
  <!-- GAUGE 3: MACH P-CORE AFFINITY (LOCKED)     -->
  <!-- ========================================== -->
  <g transform="translate(660, 115)">
    <!-- Base Background Track (240 deg arc) -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="#15222e" stroke-width="9" 
            stroke-dasharray="230 345.5" stroke-linecap="round" transform="rotate(150)" />
    
    <!-- Glowing Full Locked Arc (100% Filled) -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="url(#lockGrad)" stroke-width="9" 
            stroke-dasharray="230 345.5" stroke-dashoffset="0" stroke-linecap="round" 
            transform="rotate(150)" filter="url(#dialGlow)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="2s" repeatCount="indefinite" />
    </circle>
    
    <text x="0" y="-2" fill="#38ef7d" font-family="monospace" font-size="20" font-weight="bold" text-anchor="middle">LOCKED</text>
    <text x="0" y="16" fill="#00f2fe" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">4.05 GHz P-CORE</text>
    <text x="0" y="32" fill="#8b949e" font-family="monospace" font-size="9" text-anchor="middle">TAG 1 · ZERO STALL</text>
  </g>
</svg>
