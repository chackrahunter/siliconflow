<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 170" width="100%" height="170">
  <defs>
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="50%" stop-color="#38ef7d" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </linearGradient>
    <filter id="radarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Box -->
  <rect x="2" y="2" width="796" height="166" rx="14" fill="#080e14" stroke="#00e5ff" stroke-width="1.5" />

  <!-- Header -->
  <text x="24" y="26" fill="#8b949e" font-family="monospace" font-size="11" font-weight="bold">AUTONOMOUS FLIGHT RECORDER &amp; 236 DIAGNOSTIC ERROR CODE MATRIX</text>
  <text x="776" y="26" fill="#38ef7d" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">SCANNING · [0 ERRORS DETECTED]</text>

  <!-- Radar Scanning Line -->
  <line x1="24" y1="36" x2="776" y2="36" stroke="url(#radarGrad)" stroke-width="2" filter="url(#radarGlow)">
    <animate attributeName="y1" values="36;155;36" dur="4s" repeatCount="indefinite" />
    <animate attributeName="y2" values="36;155;36" dur="4s" repeatCount="indefinite" />
  </line>

  <!-- Grid of Monitored Subsystems -->
  <g transform="translate(24, 45)" font-family="monospace" font-size="11">
    <!-- Row 1 -->
    <rect x="0" y="0" width="175" height="48" rx="6" fill="#0d1821" stroke="#38ef7d" stroke-width="1" />
    <text x="12" y="20" fill="#38ef7d" font-weight="bold">GC-001..030</text>
    <text x="12" y="36" fill="#8b949e" font-size="10">ZGC Spike Velocity</text>

    <rect x="190" y="0" width="175" height="48" rx="6" fill="#0d1821" stroke="#38ef7d" stroke-width="1" />
    <text x="202" y="20" fill="#38ef7d" font-weight="bold">MEM-001..025</text>
    <text x="202" y="36" fill="#8b949e" font-size="10">Mach Page Compressor</text>

    <rect x="380" y="0" width="175" height="48" rx="6" fill="#0d1821" stroke="#38ef7d" stroke-width="1" />
    <text x="392" y="20" fill="#38ef7d" font-weight="bold">GPU-001..040</text>
    <text x="392" y="36" fill="#8b949e" font-size="10">TBDR Tile Spills</text>

    <rect x="570" y="0" width="175" height="48" rx="6" fill="#0d1821" stroke="#38ef7d" stroke-width="1" />
    <text x="582" y="20" fill="#38ef7d" font-weight="bold">CHK-001..030</text>
    <text x="582" y="36" fill="#8b949e" font-size="10">Sodium Meshing Queue</text>

    <!-- Row 2 -->
    <rect x="0" y="56" width="175" height="48" rx="6" fill="#0d1821" stroke="#38ef7d" stroke-width="1" />
    <text x="12" y="76" fill="#38ef7d" font-weight="bold">SYS-001..020</text>
    <text x="12" y="92" fill="#8b949e" font-size="10">Mach QoS Core Migration</text>

    <rect x="190" y="56" width="175" height="48" rx="6" fill="#0d1821" stroke="#38ef7d" stroke-width="1" />
    <text x="202" y="76" fill="#38ef7d" font-weight="bold">ENT-001..030</text>
    <text x="202" y="92" fill="#8b949e" font-size="10">Iris Shadow Culling</text>

    <rect x="380" y="56" width="175" height="48" rx="6" fill="#0d1821" stroke="#38ef7d" stroke-width="1" />
    <text x="392" y="76" fill="#38ef7d" font-weight="bold">PRT-001..020</text>
    <text x="392" y="92" fill="#8b949e" font-size="10">Particle Storm Budgets</text>

    <rect x="570" y="56" width="175" height="48" rx="6" fill="#003b46" stroke="#00f2fe" stroke-width="1.5" />
    <text x="582" y="76" fill="#00f2fe" font-weight="bold">OK-000</text>
    <text x="582" y="92" fill="#38ef7d" font-size="10">OPTIMAL FLIGHT STATE</text>
  </g>
</svg>
