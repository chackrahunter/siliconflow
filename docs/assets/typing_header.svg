<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#080c10"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card Background with Neon Border -->
  <rect x="2" y="2" width="796" height="116" rx="10" fill="url(#bgGrad)" stroke="#00e5ff" stroke-width="1.5" />

  <!-- Terminal Header Dots -->
  <circle cx="22" cy="18" r="4.5" fill="#ff5f56"/>
  <circle cx="36" cy="18" r="4.5" fill="#ffbd2e"/>
  <circle cx="50" cy="18" r="4.5" fill="#27c93f"/>
  <text x="70" y="22" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11" font-weight="600">SILICONFLOW · APPLE SILICON QUANTUM ENGINE</text>

  <!-- Pulsing Status Tag -->
  <rect x="670" y="10" width="115" height="18" rx="9" fill="#003b46" stroke="#00f2fe" stroke-width="1">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="727" y="22" fill="#00f2fe" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">SILICONFLOW ACTIVE</text>

  <!-- Animated Terminal Text Lines -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13">
    <!-- Line 1: Mach QoS Lock -->
    <text x="24" y="52" fill="#7ee787">
      <tspan fill="#58a6ff">&gt;</tspan> [SILICONFLOW_CORE] Locking Render Thread to 4.05 GHz P-Cores...
      <tspan fill="#00f2fe" font-weight="bold" filter="url(#glow)">[AFFINITY TAG 1 LOCKED]</tspan>
    </text>

    <!-- Line 2: Sodium SWAP Meshing -->
    <text x="24" y="76" fill="#e6edf3">
      <tspan fill="#58a6ff">&gt;</tspan> [TBDR_METAL] Zero-Copy Chunk Allocator:
      <tspan fill="#ffca28" font-weight="bold">SWAP Direct Buffers</tspan> | Vertex Format:
      <tspan fill="#38ef7d" font-weight="bold">COMPACT</tspan>
    </text>

    <!-- Line 3: Live Metrics -->
    <text x="24" y="100" fill="#00f2fe" font-weight="bold">
      <tspan fill="#58a6ff">&gt;</tspan> [LIVE_STATUS] Frametime: <tspan fill="#ffca28">1.8 ms</tspan> | FPS: <tspan fill="#38ef7d">541.0 [HIGH/STABLE]</tspan> | Stutter Matrix: <tspan fill="#7ee787">[OK-000]</tspan>
    </text>
  </g>
</svg>
